name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railforge
          POSTGRES_PASSWORD: dev-password
          POSTGRES_DB: railforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railforge -d railforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://railforge:dev-password@localhost:5432/railforge
      REDIS_URL: redis://localhost:6379
      XRPL_NETWORK: testnet
      XRPL_WS_URL: wss://s.altnet.rippletest.net:51233
      # Server-side pepper for HMAC API key hashing. Auth middleware fails-fast
      # if this is unset (see apps/api/src/middleware/auth.ts). Using a fixed
      # CI value is fine — no real keys live in this environment.
      API_KEY_SALT: ci-test-salt-not-for-production
      # Per-commit integration test gate. Sprint 3 promotes integration tests
      # from "manually run with this var set" to "always run in CI". The
      # tradeoff is testnet faucet credit burn for same-day mock/prod drift
      # detection — see PLAN.md Sprint 3 handoff notes.
      RAILFORGE_TEST_NETWORK: testnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bun run db:migrate

      - name: Unit tests
        run: bun run test

      - name: Integration tests (testnet + real DB)
        # These hit XRPL testnet via the faucet. They are slow and flaky
        # against the public testnet on a bad day — but the cost of mock/
        # prod divergence going undetected for a sprint is higher than the
        # cost of the occasional retry. Same Postgres + Redis services
        # already provisioned above; no extra setup.
        run: bun run test:integration

  dependency-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Socket detects supply-chain attacks, typosquats, and known
      # vulnerabilities in the dependency tree. Free for open-source.
      - name: Socket Security scan
        uses: SocketDev/socket-security-action@v1
        if: github.event_name == 'pull_request'

      # npm audit as a fallback — catches CVEs in the npm advisory DB.
      # --audit-level=high avoids noise from low/moderate findings that
      # would block CI without actionable fixes.
      - name: npm audit (high + critical)
        run: bunx npm-audit-html@latest --registry https://registry.npmjs.org || true
        continue-on-error: true
