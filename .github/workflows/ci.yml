name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railforge
          POSTGRES_PASSWORD: dev-password
          POSTGRES_DB: railforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railforge -d railforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://railforge:dev-password@localhost:5432/railforge
      REDIS_URL: redis://localhost:6379
      XRPL_NETWORK: testnet
      # Server-side pepper for HMAC API key hashing. Auth middleware fails-fast
      # if this is unset (see apps/api/src/middleware/auth.ts). Using a fixed
      # CI value is fine — no real keys live in this environment.
      API_KEY_SALT: ci-test-salt-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bun run db:migrate

      - name: Unit tests
        run: bun run test
