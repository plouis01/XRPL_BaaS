# RailForge Redis — config tuned for BullMQ.
#
# This file is mounted into the image at /etc/redis/redis.conf. The
# password is NOT here — it's appended at start time as --requirepass via
# the entrypoint, pulling from $REDIS_PASSWORD (set as a Fly secret).

# Bind on all interfaces — BOTH IPv4 and IPv6. Fly's 6PN private network
# is IPv6-only (app-to-app via `.internal` hostnames resolves to AAAA),
# so listening on 0.0.0.0 alone leaves the worker → Redis connection
# refused at the kernel (RST on connect → ECONNREFUSED). The `-::*` form
# means "listen on every IPv6 interface, ignore errors if IPv6 isn't
# available" (so a local-only test on an IPv4-only host doesn't fail).
# This is the standard Redis 6+ "listen everywhere" idiom.
#
# There is no public IP attached to this app and no [http_service] /
# [[services]] block in fly.toml, so `protected-mode no` is safe — the
# only reachable path is from sibling apps over 6PN.
bind 0.0.0.0 -::*
port 6379
protected-mode no

# AOF persistence. `everysec` fsyncs once per second — the standard
# durability/throughput trade-off. In the worst case (Bun → AOF flush
# race during a crash) we lose at most ~1 s of writes. BullMQ jobs lost
# in that window are caught by the orphan reconciler (5-min sweep), so
# the practical exposure is the queue depth at the moment of crash.
appendonly yes
appendfsync everysec
dir /data

# Eviction policy. CRITICAL for BullMQ: `noeviction` means Redis refuses
# writes when memory is full rather than silently dropping job keys.
# Any other policy (allkeys-lru, etc.) could evict queue entries mid-job.
# We watch memory pressure via Fly metrics and scale the VM up if it
# climbs — losing queue state is not an option.
maxmemory-policy noeviction

# Log level. `notice` is the upstream default; bumped here just to make
# the choice explicit. Logs go to stderr → Fly logs.
loglevel notice
