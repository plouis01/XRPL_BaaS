# RailForge worker — BullMQ consumer (txSubmitter, txConfirmer,
# webhookDelivery, credentialExpiry, orphanReconciler, accountSetup).
# Private — no inbound services. Reachable from the API via Fly's 6PN
# at railforge-worker.internal if ever needed.
# Deploy:  fly deploy -c apps/worker/fly.toml

app            = 'railforge-worker'
primary_region = 'cdg'

[build]
  dockerfile = '../../Dockerfile.fly'

  [build.args]
    APP_NAME = 'worker'

[env]
  HSM_PROVIDER = 'softhsm'   # CloudHSM is Phase 2/3 — see PLAN.md §7.2
  NODE_ENV     = 'production'
  XRPL_NETWORK = 'testnet'

# CRITICAL: must stay running. Scaling to zero kills the BullMQ blocking
# poll and any in-flight tx confirmer waiting on LastLedgerSequence.
[deploy]
  strategy = 'rolling'

# Machines without [http_service] or [[services]] run continuously by
# default — that's what we want for a queue consumer.

[[vm]]
  size      = 'shared-cpu-1x'
  memory    = '512mb'
  cpu_kind  = 'shared'
  cpus      = 1
  memory_mb = 512
