# RailForge API — public Hono service.
# Deploy from the repo root:  fly deploy -c apps/api/fly.toml

app            = 'railforge-api'
primary_region = 'cdg'

[build]
  dockerfile = '../../Dockerfile.fly'

  [build.args]
    APP_NAME = 'api'

[env]
  API_PORT     = '3000'
  NODE_ENV     = 'production'
  XRPL_NETWORK = 'testnet'
  # Secrets (DATABASE_URL, REDIS_URL, API_KEY_SALT, WEBHOOK_SIGNING_SECRET,
  # DASHBOARD_ORIGIN, TREASURY_*, TRUSTED_PROXY_IPS) are injected via
  # `fly secrets set` — never put credentials in fly.toml (it's checked in).

[http_service]
  internal_port        = 3000
  force_https          = true
  # Keep the API hot. auto_stop=stop with min=0 was racing the health
  # check on the free tier — Fly stopped the machine before the first
  # check could pass, then never re-ran the check on the stopped VM
  # (perpetual critical state). One always-on free shared-cpu-1x is
  # under the 3-VM allowance anyway.
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ['app']

  [http_service.concurrency]
    type       = 'requests'
    soft_limit = 200
    hard_limit = 250

  # Health check via the modern http_service.checks (replaces the old
  # [[services.http_checks]] which Fly will hard-fail validation on).
  [[http_service.checks]]
    grace_period = '10s'
    interval     = '30s'
    method       = 'GET'
    path         = '/'
    timeout      = '5s'

[[vm]]
  size      = 'shared-cpu-1x'
  memory    = '512mb'
  cpu_kind  = 'shared'
  cpus      = 1
  memory_mb = 512
