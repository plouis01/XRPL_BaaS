# RailForge indexer — subscribes to rippled `ledger` stream, persists
# transactions to Postgres. Private — no inbound services.
# Deploy:  fly deploy -c apps/indexer/fly.toml

app            = 'railforge-indexer'
primary_region = 'cdg'

[build]
  dockerfile = '../../Dockerfile.fly'

  [build.args]
    APP_NAME = 'indexer'

[env]
  NODE_ENV     = 'production'
  XRPL_NETWORK = 'testnet'
  XRPL_WS_URL  = 'wss://s.altnet.rippletest.net:51233'

# CRITICAL: indexer holds a long-lived WebSocket subscription. Rolling
# would briefly run two subscribers; immediate replaces atomically.
[deploy]
  strategy = 'immediate'

[[vm]]
  size      = 'shared-cpu-1x'
  memory    = '256mb'
  cpu_kind  = 'shared'
  cpus      = 1
  memory_mb = 256
